name: Bug report
description: Something is broken or behaving unexpectedly.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out the sections below — issues without a clear reproduction often can't be acted on.

        Write a plain title. A maintainer adds the priority prefix (`P0:` / `P1:` / `P2:`) and the `area:*` label at triage ([`AGENTS.md`](https://github.com/Tauri-EPO/whatsapp-mcp/blob/main/AGENTS.md) §11).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
      placeholder: "send_message returns 200 but message never arrives in WhatsApp."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact, minimal steps. Include commands, tool calls and their results, or curl invocations.
      placeholder: |
        1. Stack running with `docker compose up -d` (or: bridge with `go run .`, MCP server with `uv run main.py`)
        2. From the MCP client, call `send_message` with `{...}`
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, stack traces, and bridge logs if relevant. Redact phone numbers.
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is it running?
      options:
        - Docker Compose (this repository's compose file)
        - Docker Compose under a stack manager (Komodo, Portainer)
        - Bare processes (`go run .` and `uv run main.py`, e.g. stdio on a laptop)
        - Other
    validations:
      required: true

  - type: input
    id: bridge-version
    attributes:
      label: Bridge build
      description: "`version` and `commit` from the `bridge_status` tool (inside its `version` object), or from `docker compose exec bridge wget -qO- http://127.0.0.1:8080/api/version`. Example: `v2.0.0`, commit `575ee0b`."
    validations:
      required: true

  - type: input
    id: mcp-version
    attributes:
      label: MCP server build
      description: "The `whatsapp-mcp-server <version>+<sha>` line of its startup log (`docker compose logs mcp`), or `serverInfo.version` in the `initialize` response. An image tag such as `latest` does not identify a build."
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system of the host
      options:
        - Linux
        - macOS
        - Windows
        - Windows (WSL)
        - Other
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: AI client
      description: e.g. Claude Code 2.x, Claude Desktop 0.x, Cursor 1.x, custom MCP client
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "Paste bridge / MCP server logs (`docker compose logs bridge`, `docker compose logs mcp`) and, for a compose deployment, the output of `docker compose ps`. Redact phone numbers."
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I'm running the latest release (or `main`).
          required: true
        - label: I redacted phone numbers / message contents from logs.
          required: true
