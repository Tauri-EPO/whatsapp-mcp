name: Feature request
description: Propose a new feature or enhancement.
title: "feat: <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, skim the README "Is this for you?" section and [`AGENTS.md`](https://github.com/Tauri-EPO/whatsapp-mcp/blob/main/AGENTS.md) §11 for the issue format (problem, fix sketch, acceptance).

        State the **problem**, not the solution. Solutions are easier to design once the problem is clear.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that's hard or impossible today?
      placeholder: "When my agent receives a message in a group chat, it can't tell who the sender is by name — only the JID."
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Concrete scenario. Who's the user? What are they doing?
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Which part does this touch?
      description: Becomes the `area:*` label at triage.
      options:
        - Bridge (Go, WhatsApp connection, REST)
        - MCP server (Python, tools)
        - Media (download, cache, files)
        - Transcription
        - Docker / operations
        - CI / release
        - "I'm not sure"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach (optional)
      description: If you have a specific implementation in mind, describe it. Otherwise, leave blank.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the underlying problem (e.g. existing tools, downstream forks, manual workarounds).

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance (optional)
      description: How will we know it is done? A short checklist of observable results.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I read the README ("Is this for you?" and "Why this fork") and believe this fits the project's goals.
          required: true
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I'm willing to help test or implement this (optional but appreciated).
          required: false
