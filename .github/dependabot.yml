version: 2
updates:
  # "uv" updates pyproject.toml *and* uv.lock together; "pip" only touched
  # pyproject.toml and left the lockfile (which CI and the image use) behind.
  - package-ecosystem: "uv"
    directory: "/whatsapp-mcp-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      pip-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      pip-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "gomod"
    directory: "/whatsapp-bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      gomod-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      gomod-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # Base images in both Dockerfiles (golang, alpine, python, uv).
  - package-ecosystem: "docker"
    directory: "/whatsapp-bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/whatsapp-mcp-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # A new Python minor is a deliberate move (wheels, pyright target,
      # .python-version), not a weekly bump; see #176.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The whisper.cpp image digest in docker-compose.yml.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
