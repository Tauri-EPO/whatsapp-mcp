name: Publish images

# Every push to main publishes the edge images to GHCR:
#   ghcr.io/<owner>/whatsapp-mcp-{bridge,server}:main and :sha-<7>
# Releases (release.yml) publish vX.Y.Z, X.Y and latest. The build itself
# lives in build-push.yml. Packages must be public once (GitHub UI); docs in
# docs/DOCKER.md "Published images".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  meta:
    name: Tags
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.short.outputs.short }}
    steps:
      - id: short
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
  publish:
    needs: meta
    uses: ./.github/workflows/build-push.yml
    with:
      ref: ${{ github.sha }}
      version: main
      tags: main sha-${{ needs.meta.outputs.short }}
    permissions:
      contents: read
      packages: write
