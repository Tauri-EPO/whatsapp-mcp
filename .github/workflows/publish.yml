name: Publish images

# Builds the bridge and MCP images for linux/amd64 and linux/arm64 on every
# push to main and publishes them to GHCR as
#   ghcr.io/<owner>/whatsapp-mcp-bridge:{main,sha-<7>}
#   ghcr.io/<owner>/whatsapp-mcp-server:{main,sha-<7>}
# so a server can `docker compose pull` instead of building. The packages must
# be made public once in the GitHub UI (Packages > package > Settings); the
# GITHUB_TOKEN cannot change visibility. docs/DOCKER.md describes both deploy
# modes; the CI workflow keeps building (never pushing) on pull requests.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names and tags
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
      - name: Build and push bridge
        uses: docker/build-push-action@v7
        with:
          context: whatsapp-bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/whatsapp-mcp-bridge:main
            ghcr.io/${{ steps.meta.outputs.owner }}/whatsapp-mcp-bridge:sha-${{ steps.meta.outputs.short }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,scope=bridge,mode=max
      - name: Build and push MCP server
        uses: docker/build-push-action@v7
        with:
          context: whatsapp-mcp-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/whatsapp-mcp-server:main
            ghcr.io/${{ steps.meta.outputs.owner }}/whatsapp-mcp-server:sha-${{ steps.meta.outputs.short }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max
