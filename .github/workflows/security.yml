name: Security

# Runs on pull requests (where the results gate the merge), weekly on main
# (catches new advisories against unchanged code) and by hand. Not on every
# push to main: a squash-merged PR was already scanned as a PR.
on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  codeql-python:
    name: CodeQL Analysis (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  codeql-go:
    name: CodeQL Analysis (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install package dependencies
        run: |
          cd whatsapp-mcp-server
          pip install -e .

      - name: Audit dependencies
        run: pip-audit
        continue-on-error: true

  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r whatsapp-mcp-server/ -ll
        continue-on-error: true

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          cd whatsapp-bridge
          govulncheck ./...
        continue-on-error: true

  image-scan:
    name: Image Vulnerability Scan
    # Trivy over the two images: on PRs the freshly built ones (base image or
    # Dockerfile changes), on the weekly run the published GHCR tags (new
    # advisories against the unchanged image). Informational like the other
    # audits: read the summary, do not ignore it.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [bridge, server]
        include:
          - component: bridge
            context: whatsapp-bridge
          - component: server
            context: whatsapp-mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (pull request)
        if: github.event_name != 'schedule'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: whatsapp-mcp-${{ matrix.component }}:scan
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=scan
          cache-from: type=gha,scope=${{ matrix.component == 'bridge' && 'bridge' || 'mcp' }}
      - name: Pick the image to scan
        id: image
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ref=ghcr.io/tauri-epo/whatsapp-mcp-${{ matrix.component }}:main" >> "$GITHUB_OUTPUT"
          else
            echo "ref=whatsapp-mcp-${{ matrix.component }}:scan" >> "$GITHUB_OUTPUT"
          fi
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          output: trivy-${{ matrix.component }}.txt
        continue-on-error: true
      - name: Summary
        if: always()
        run: |
          {
            echo "## Trivy: ${{ steps.image.outputs.ref }}"
            echo
            echo '```'
            cat trivy-${{ matrix.component }}.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
