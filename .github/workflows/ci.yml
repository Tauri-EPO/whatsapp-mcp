name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate project versions are in sync
        run: python .github/scripts/check_versions.py

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies (locked)
        run: |
          cd whatsapp-mcp-server
          uv sync --frozen --extra dev
      - name: Run ruff check
        run: |
          cd whatsapp-mcp-server
          uv run ruff check .
      - name: Run ruff format check
        run: |
          cd whatsapp-mcp-server
          uv run ruff format --check .

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.0
          working-directory: whatsapp-bridge
          # `config verify` downloads the JSON schema from golangci-lint.run on
          # every run and has timed out repeatedly; the config is validated by
          # the lint run itself.
          verify: false

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Build
        run: |
          cd whatsapp-bridge
          go build -tags sqlite_fts5 -v ./...
          go vet -tags sqlite_fts5 ./...
      - name: Test
        run: |
          cd whatsapp-bridge
          go test -tags sqlite_fts5 ./...

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies (locked)
        run: |
          cd whatsapp-mcp-server
          uv sync --frozen --extra dev
      - name: Run tests
        run: |
          cd whatsapp-mcp-server
          uv run pytest -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build bridge image
        uses: docker/build-push-action@v6
        with:
          context: whatsapp-bridge
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=ci
          load: true
          tags: whatsapp-mcp-bridge:ci
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,scope=bridge,mode=max
      - name: Build MCP image
        uses: docker/build-push-action@v6
        with:
          context: whatsapp-mcp-server
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=ci
          load: true
          tags: whatsapp-mcp-server:ci
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max
      - name: Smoke test images
        run: |
          # Bridge: the binary starts, prints its banner and creates the store (no pairing needed for this).
          docker run --rm --entrypoint sh whatsapp-mcp-bridge:ci -c 'cd /tmp && mkdir -p store && (timeout 15 /usr/local/bin/whatsapp-bridge >/tmp/out 2>&1 || true); grep -E "Full-text search index|SQLite built without FTS5" /tmp/out && grep -F "commit ${{ github.sha }}" /tmp/out'
          # MCP: every module imports inside the image (catches a missing COPY like the transcribe.py incident).
          docker run --rm whatsapp-mcp-server:ci python -c "import main, whatsapp, transcribe, http_auth, chat_policy, mcp_config, parent_watchdog, audio; print('imports ok')"
