name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies (locked)
        run: |
          cd whatsapp-mcp-server
          uv sync --frozen --extra dev
      - name: Run ruff check
        run: |
          cd whatsapp-mcp-server
          uv run ruff check .
      - name: Run ruff format check
        run: |
          cd whatsapp-mcp-server
          uv run ruff format --check .
      - name: Run pyright
        run: |
          cd whatsapp-mcp-server
          uv run pyright
      - name: Install audio test tooling
        # Exercise the provider's real oversized-audio chunking and existing
        # audio integration tests rather than depending on the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Run tests
        run: |
          cd whatsapp-mcp-server
          uv run pytest -q

  go:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: whatsapp-bridge/go.sum
      - name: Build, vet, test
        run: |
          cd whatsapp-bridge
          go build -v ./...
          go vet ./...
          go test ./...
          # The compose file sets TZ; media file names and timestamps must not
          # depend on the process zone (media_tz_test.go and friends).
          TZ=America/Sao_Paulo go test ./...
      - name: Race detector
        # Own step so its cost and its failures are legible. The shipped binary
        # is CGO_ENABLED=0, but -race needs cgo and the amd64 runner has it
        # (issue #351). The suite is one package and takes about nine minutes
        # under -race, so go test's default ten-minute timeout no longer fits.
        run: |
          cd whatsapp-bridge
          go test -race -timeout 25m ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: whatsapp-bridge
          # `config verify` downloads the JSON schema from golangci-lint.run on
          # every run and has timed out repeatedly; the config is validated by
          # the lint run itself.
          verify: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build bridge image
        uses: docker/build-push-action@v7
        with:
          context: whatsapp-bridge
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=ci
          load: true
          tags: whatsapp-mcp-bridge:ci
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,scope=bridge,mode=max
      - name: Build MCP image
        uses: docker/build-push-action@v7
        with:
          context: whatsapp-mcp-server
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=ci
          load: true
          tags: whatsapp-mcp-server:ci
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max
      - name: Smoke test images
        run: |
          # Bridge: the binary starts, prints its banner and creates the store (no pairing needed for this).
          docker run --rm --entrypoint sh whatsapp-mcp-bridge:ci -c 'cd /tmp && mkdir -p store && (timeout 15 /usr/local/bin/whatsapp-bridge >/tmp/out 2>&1 || true); grep -E "Full-text search index [(]FTS5[)] active for messages.content" /tmp/out && grep -F "commit ${{ github.sha }}" /tmp/out'
          # MCP: every module imports inside the image (catches a missing COPY like the transcribe.py incident).
          # The names come from py-modules in the mounted pyproject.toml (the list a wheel
          # would ship), so a new module is covered without editing this workflow.
          docker run --rm -v "$PWD/whatsapp-mcp-server/pyproject.toml:/tmp/pyproject.toml:ro" whatsapp-mcp-server:ci python -c '
          import importlib, tomllib, traceback
          with open("/tmp/pyproject.toml", "rb") as handle:
              modules = tomllib.load(handle)["tool"]["setuptools"]["py-modules"]
          if len(modules) < 10:
              raise SystemExit(f"py-modules has {len(modules)} entries: read the wrong file?")
          for name in modules:
              try:
                  importlib.import_module(name)
              except Exception:
                  traceback.print_exc()
                  raise SystemExit(f"import {name} failed (traceback above)")
          print(f"imports ok: {len(modules)} modules")
          '
      - name: Compose smoke test (unpaired stack)
        # Start the real compose topology with the images built above and run
        # the operator's post-deploy check. Exit 2 = up but waiting for a QR
        # scan, which is the only outcome possible in CI.
        run: |
          docker tag whatsapp-mcp-bridge:ci ghcr.io/tauri-epo/whatsapp-mcp-bridge:ci
          docker tag whatsapp-mcp-server:ci ghcr.io/tauri-epo/whatsapp-mcp-server:ci
          printf 'WHATSAPP_BRIDGE_TOKEN=ci-smoke-token-0123456789abcdef\nWHATSAPP_IMAGE_TAG=ci\n' > .env
          docker compose up -d --no-build bridge mcp
          set +e
          scripts/smoke.sh --wait 90
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "smoke.sh exited $rc (expected 2: stack up, unpaired)"
            docker compose logs --tail 100
            exit 1
          fi
      - name: Compose down
        if: always()
        run: docker compose down -v --remove-orphans || true

  bridge-arm64:
    name: Bridge arm64 (QEMU)
    # The linux/arm64 bridge is published on every merge, and modernc.org/sqlite
    # carries architecture-specific generated libc code that nothing else here
    # runs on arm64 (issue #470). This job builds the image, starts it under
    # QEMU like the amd64 smoke, and runs the whole Go test suite as an arm64
    # binary in that image. The image cross-compiles on the native builder;
    # the runtime smoke and full test binary still execute under QEMU.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: whatsapp-bridge/go.sum
      - name: Build bridge image for arm64
        uses: docker/build-push-action@v7
        with:
          context: whatsapp-bridge
          platforms: linux/arm64
          push: false
          load: true
          tags: whatsapp-mcp-bridge:ci-arm64
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=ci
          cache-from: type=gha,scope=bridge-arm64
          cache-to: type=gha,scope=bridge-arm64,mode=max
      - name: Smoke test the arm64 image
        run: |
          # A silent fallback to amd64 would make everything below prove nothing.
          image_arch=$(docker image inspect --format '{{.Architecture}}' whatsapp-mcp-bridge:ci-arm64)
          [ "$image_arch" = "arm64" ] || { echo "image is '$image_arch', expected arm64"; exit 1; }
          arch=$(docker run --rm --platform linux/arm64 --entrypoint uname whatsapp-mcp-bridge:ci-arm64 -m)
          [ "$arch" = "aarch64" ] || { echo "image runs as '$arch', expected aarch64"; exit 1; }
          # Same check as the amd64 smoke: the binary starts, creates the store, reports the
          # FTS state. Poll for the line (QEMU start-up speed varies) instead of a fixed wait.
          docker run --rm --platform linux/arm64 --entrypoint sh whatsapp-mcp-bridge:ci-arm64 -c '
            cd /tmp && mkdir -p store
            timeout 120 /usr/local/bin/whatsapp-bridge >/tmp/out 2>&1 &
            pid=$!
            for i in $(seq 120); do
              grep -qE "Full-text search index [(]FTS5[)] active for messages.content" /tmp/out && break
              sleep 1
            done
            kill $pid 2>/dev/null; wait $pid 2>/dev/null
            cat /tmp/out
            grep -E "Full-text search index [(]FTS5[)] active for messages.content" /tmp/out && grep -F "commit ${{ github.sha }}" /tmp/out'
      - name: Go tests as an arm64 binary
        run: |
          # Compiled natively (CGO_ENABLED=0 cross-compiles), executed under QEMU in
          # the arm64 image, which has tzdata for the zone the tests ask for.
          cd whatsapp-bridge
          CGO_ENABLED=0 GOARCH=arm64 go test -c -o "$RUNNER_TEMP/bridge-arm64.test" .
          # `env -i` drops the image's own ENV (store dir, media roots, port): the tests
          # must see what they see on the amd64 runner. The source is mounted writable,
          # like the checkout `go test` runs in there, as the same user.
          docker run --rm --platform linux/arm64 --user "$(id -u):$(id -g)" --entrypoint env \
            -v "$RUNNER_TEMP:/t:ro" -v "$PWD:/src" -w /src whatsapp-mcp-bridge:ci-arm64 \
            -i PATH=/usr/bin:/bin HOME=/tmp /t/bridge-arm64.test -test.timeout=25m
