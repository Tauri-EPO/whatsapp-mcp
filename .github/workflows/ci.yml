name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies (locked)
        run: |
          cd whatsapp-mcp-server
          uv sync --frozen --extra dev
      - name: Run ruff check
        run: |
          cd whatsapp-mcp-server
          uv run ruff check .
      - name: Run ruff format check
        run: |
          cd whatsapp-mcp-server
          uv run ruff format --check .
      - name: Run pyright
        run: |
          cd whatsapp-mcp-server
          uv run pyright
      - name: Run tests
        run: |
          cd whatsapp-mcp-server
          uv run pytest -q

  go:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: whatsapp-bridge/go.sum
      - name: Build, vet, test
        run: |
          cd whatsapp-bridge
          go build -v ./...
          go vet ./...
          go test ./...
          # The compose file sets TZ; media file names and timestamps must not
          # depend on the process zone (media_tz_test.go and friends).
          TZ=America/Sao_Paulo go test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.0
          working-directory: whatsapp-bridge
          # `config verify` downloads the JSON schema from golangci-lint.run on
          # every run and has timed out repeatedly; the config is validated by
          # the lint run itself.
          verify: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build bridge image
        uses: docker/build-push-action@v7
        with:
          context: whatsapp-bridge
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=ci
          load: true
          tags: whatsapp-mcp-bridge:ci
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,scope=bridge,mode=max
      - name: Build MCP image
        uses: docker/build-push-action@v7
        with:
          context: whatsapp-mcp-server
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=ci
          load: true
          tags: whatsapp-mcp-server:ci
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max
      - name: Smoke test images
        run: |
          # Bridge: the binary starts, prints its banner and creates the store (no pairing needed for this).
          docker run --rm --entrypoint sh whatsapp-mcp-bridge:ci -c 'cd /tmp && mkdir -p store && (timeout 15 /usr/local/bin/whatsapp-bridge >/tmp/out 2>&1 || true); grep -E "Full-text search index|SQLite built without FTS5" /tmp/out && grep -F "commit ${{ github.sha }}" /tmp/out'
          # MCP: every module imports inside the image (catches a missing COPY like the transcribe.py incident).
          docker run --rm whatsapp-mcp-server:ci python -c "import main, whatsapp, transcribe, http_auth, chat_policy, mcp_config, parent_watchdog, audio, errors, observability, media_inventory, media_notes; print('imports ok')"
      - name: Compose smoke test (unpaired stack)
        # Start the real compose topology with the images built above and run
        # the operator's post-deploy check. Exit 2 = up but waiting for a QR
        # scan, which is the only outcome possible in CI.
        run: |
          docker tag whatsapp-mcp-bridge:ci ghcr.io/tauri-epo/whatsapp-mcp-bridge:ci
          docker tag whatsapp-mcp-server:ci ghcr.io/tauri-epo/whatsapp-mcp-server:ci
          printf 'WHATSAPP_BRIDGE_TOKEN=ci-smoke-token-0123456789abcdef\nWHATSAPP_IMAGE_TAG=ci\n' > .env
          docker compose up -d --no-build bridge mcp
          set +e
          scripts/smoke.sh --wait 90
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "smoke.sh exited $rc (expected 2: stack up, unpaired)"
            docker compose logs --tail 100
            exit 1
          fi
      - name: Compose down
        if: always()
        run: docker compose down -v --remove-orphans || true
      - name: Build bridge image for arm64
        # Raspberry Pi / ARM VPS users build this themselves; make sure the pure-Go
        # build keeps cross-compiling. Not loaded or smoke-tested (QEMU is slow).
        uses: docker/build-push-action@v7
        with:
          context: whatsapp-bridge
          platforms: linux/arm64
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=ci
          cache-from: type=gha,scope=bridge-arm64
          cache-to: type=gha,scope=bridge-arm64,mode=max
