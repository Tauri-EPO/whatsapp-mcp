name: Release cut

# Cuts at most one release a day. release.yml keeps a "chore(main): release
# X.Y.Z" PR open whenever main carries releasable commits since the last tag;
# this job merges that PR on a schedule and then dispatches release.yml, which
# creates the tag, the GitHub Release and the vX.Y.Z / X.Y / latest / main /
# sha-<7> images.
#
# The explicit dispatch is required: a merge made with GITHUB_TOKEN does not
# fire `on: push` workflows, and workflow_dispatch is the documented exception.
# One dispatch is enough: release.yml puts the edge tags on the release commit
# off the same build, so it is not built a second time in parallel by
# publish.yml (issue #333). publish.yml is still dispatched, but only if the
# release dispatch failed after the PR was merged - then it is the only build,
# not a second one.
#
# To cut earlier, run this workflow by hand (`gh workflow run release-cut.yml`):
# the release PR's head carries no check of its own, and the ruleset on main
# requires them, so a bare `gh pr merge` on it is refused. The job refuses to
# merge while CI on main is running and fails loudly when CI on main is red.

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 America/Sao_Paulo (UTC-3, no DST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Merge the release PR and dispatch release.yml
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find the release PR
        id: pr
        run: |
          number=$(gh pr list --state open --head release-please--branches--main \
            --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open release PR: nothing releasable since the last tag."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Release PR: #$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Require green CI on the current main
        id: ci
        if: steps.pr.outputs.number != ''
        run: |
          head=$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)
          run=$(gh run list --workflow ci.yml --branch main --limit 10 \
            --json headSha,status,conclusion \
            --jq "[.[] | select(.headSha == \"$head\")][0]")
          if [ -z "$run" ] || [ "$run" = "null" ]; then
            echo "::notice::No CI run for main@$head yet; skipping this cut."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(echo "$run" | jq -r .status)
          conclusion=$(echo "$run" | jq -r .conclusion)
          if [ "$status" != "completed" ]; then
            echo "::notice::CI on main@$head is still $status; skipping this cut."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI on main@$head finished with '$conclusion'; not cutting a release."
            exit 1
          fi
          echo "CI on main@$head is green."
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # The ruleset on main requires the CI jobs green on a head that is up to
      # date with main (issue #545). Two things stand between the release PR
      # and that rule. It is opened by github-actions[bot], whose pull_request
      # runs wait for an approval nobody gives, so its head carries no check;
      # and release-please only rewrites the branch when the notes change, so
      # after a docs: / ci: / test: / chore: merge it sits behind main.
      # Hence the loop: bring the branch up to date, run CI on that head
      # (workflow_dispatch is the documented exception to "GITHUB_TOKEN events
      # start no workflow"; the checks land on the head commit, which is what
      # the ruleset reads), merge exactly that commit, and go round again if
      # main moved meanwhile.
      - name: Merge the release PR
        id: merge
        if: steps.ci.outputs.ready == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: release-please--branches--main
        run: |
          for attempt in 1 2 3; do
            behind=$(gh api "repos/$GH_REPO/compare/$BRANCH...main" --jq .ahead_by)
            if [ "$behind" != "0" ]; then
              echo "attempt $attempt: the release branch is $behind commit(s) behind main; updating it"
              gh pr update-branch "$PR"
              sleep 10
            fi
            sha=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run ci.yml --ref "$BRANCH"
            run=""
            for _ in $(seq 1 36); do
              # Only a run created by this dispatch: an earlier cut may have
              # left a finished run on the same head.
              run=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 10 \
                --json databaseId,headSha,createdAt \
                --jq "[.[] | select(.headSha == \"$sha\" and .createdAt >= \"$since\")][0].databaseId // empty")
              [ -n "$run" ] && break
              sleep 5
            done
            if [ -z "$run" ]; then
              echo "::error::CI was dispatched on $BRANCH but no run for $sha appeared; not cutting a release."
              exit 1
            fi
            echo "attempt $attempt: CI run $run on the release PR head $sha"
            if ! gh run watch "$run" --exit-status --interval 20; then
              echo "::error::CI failed on the release PR head $sha (run $run); not cutting a release."
              exit 1
            fi
            if gh pr merge "$PR" --squash --delete-branch --match-head-commit "$sha"; then
              echo "Release PR #$PR merged at $sha."
              exit 0
            fi
            echo "::notice::attempt $attempt: the merge was refused (main or the release branch moved during CI); going round again."
            sleep 10
          done
          echo "::error::The release PR could not be merged in 3 attempts: main keeps moving. Run this workflow again."
          exit 1

      - name: Dispatch release.yml to tag and publish
        if: steps.ci.outputs.ready == 'true'
        run: |
          gh workflow run release.yml --ref main
          echo "release.yml dispatched; it creates the tag and publishes vX.Y.Z, X.Y, latest, main and sha-<7> from one build."

      # Only when the dispatch itself failed after the PR was already merged:
      # the release commit is on main with nothing scheduled to build it, and
      # publish.yml does not fire on a GITHUB_TOKEN merge. Publishing the edge
      # images is then not a second build, it is the only one.
      - name: Publish the edge images if the dispatch failed
        if: ${{ failure() && steps.merge.outcome == 'success' }}
        run: |
          gh workflow run publish.yml --ref main
          echo "release.yml could not be dispatched; publish.yml dispatched so the release commit still gets images. Tag and release it by re-running release.yml."
