# WhatsApp MCP: Go bridge + Python MCP server (streamable HTTP) for an
# always-on box. Full walkthrough (pairing, Tailscale, backups): docs/DOCKER.md
#
#   cp .env.example .env            # optional: set WHATSAPP_MCP_ALLOWED_HOSTS etc.
#   docker compose up -d --build
#   docker compose logs -f bridge   # scan the QR code on first run
#
# Topology: `mcp` joins the bridge container's network namespace
# (network_mode: service:bridge). That keeps the bridge exactly as upstream
# ships it (bound to 127.0.0.1, loopback-only Host allow-list, token file on
# disk) while letting the MCP server reach it at http://127.0.0.1:8080 and
# read messages.db from the shared volume. Consequently the MCP port is
# published on the *bridge* service.
#
# Alternative topology (MCP server elsewhere): give each service its own
# network namespace, set WHATSAPP_BRIDGE_BIND=0.0.0.0 and
# WHATSAPP_BRIDGE_ALLOWED_HOSTS=bridge on the bridge, and point the MCP
# server at WHATSAPP_API_URL=http://bridge:8080/api. See docs/DOCKER.md.

# Shared bits. json-file logging is unbounded by default: with
# WHATSAPP_LOG_LEVEL=DEBUG the bridge echoes every message, so cap it.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Resource limits are deliberately not set for bridge and mcp (they are small);
# the whisper sidecar gets one because a model plus 4 threads can starve the
# rest of a small box. Override in .env: WHISPER_MEM_LIMIT, WHISPER_CPUS.

services:
  bridge:
    build:
      context: ./whatsapp-bridge
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        VERSION: ${VERSION:-dev}
    image: whatsapp-mcp-bridge:local
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    # Drain REST, stop loops and close SQLite cleanly before SIGKILL.
    stop_grace_period: 30s
    environment:
      TZ: ${TZ:-UTC}
      WHATSAPP_BRIDGE_PORT: "8080"
      WHATSAPP_BRIDGE_BIND: ${WHATSAPP_BRIDGE_BIND:-127.0.0.1}
      WHATSAPP_BRIDGE_ALLOWED_HOSTS: ${WHATSAPP_BRIDGE_ALLOWED_HOSTS:-}
      WHATSAPP_STORE_DIR: /app/store
      WHATSAPP_MEDIA_ROOTS: /app/outbox
      WHATSAPP_MEDIA_AUTODOWNLOAD: ${WHATSAPP_MEDIA_AUTODOWNLOAD:-true}
      WHATSAPP_MEDIA_RETENTION_DAYS: ${WHATSAPP_MEDIA_RETENTION_DAYS:-}
      WHATSAPP_MEDIA_MAX_BYTES: ${WHATSAPP_MEDIA_MAX_BYTES:-}
      # Provide a token here (or in .env) to inject it from outside; leave empty
      # to let the bridge generate one into /app/store/.bridge-token, which the
      # MCP server picks up from the shared volume.
      WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-}
      WHATSAPP_DEVICE_NAME: ${WHATSAPP_DEVICE_NAME:-WhatsApp MCP}
      WHATSAPP_LOG_LEVEL: ${WHATSAPP_LOG_LEVEL:-INFO}
      WHATSAPP_LOG_FORMAT: ${WHATSAPP_LOG_FORMAT:-text}
      WHATSAPP_METRICS: ${WHATSAPP_METRICS:-true}
      # Conversation allow-list, enforced here on outbound endpoints and by the
      # MCP server on every tool. Same value for both services.
      WHATSAPP_ALLOWED_CHATS: ${WHATSAPP_ALLOWED_CHATS:-}
      # Webhooks are off by default in the container: the upstream default URL
      # points at localhost:8769, which is nothing inside this namespace.
      WEBHOOK_ENABLED: ${WEBHOOK_ENABLED:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      FORWARD_SELF: ${FORWARD_SELF:-false}
    volumes:
      - whatsapp-store:/app/store
      - ${WHATSAPP_OUTBOX:-./outbox}:/app/outbox
    ports:
      # MCP streamable-HTTP endpoint (served by the `mcp` service below).
      # Bound to loopback by default: put `tailscale serve` or an authenticating
      # reverse proxy in front of it. Set WHATSAPP_MCP_BIND=0.0.0.0 to expose on
      # every interface (not recommended without auth in front).
      - "${WHATSAPP_MCP_BIND:-127.0.0.1}:${WHATSAPP_MCP_PORT:-8000}:8000"

  mcp:
    build:
      context: ./whatsapp-mcp-server
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        VERSION: ${VERSION:-dev}
    image: whatsapp-mcp-server:local
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    network_mode: "service:bridge"
    # Wait for the bridge healthcheck (REST up), which only happens after the
    # bridge has written /app/store/.bridge-token: the MCP server resolves its
    # own HTTP bearer token from that file once, at startup.
    # restart: true recreates this container whenever the bridge is recreated,
    # otherwise it would keep a dead network namespace (network_mode above).
    depends_on:
      bridge:
        condition: service_healthy
        restart: true
    environment:
      TZ: ${TZ:-UTC}
      # Hostnames clients use to reach /mcp (Tailscale MagicDNS name, reverse
      # proxy name...). Empty = accept any Host (a warning is logged).
      WHATSAPP_MCP_ALLOWED_HOSTS: ${WHATSAPP_MCP_ALLOWED_HOSTS:-}
      WHATSAPP_MCP_ALLOWED_ORIGINS: ${WHATSAPP_MCP_ALLOWED_ORIGINS:-}
      # Bearer token clients must send to /mcp. Leave empty only for a
      # loopback/tailnet-only listener; mandatory before any Funnel exposure.
      WHATSAPP_MCP_TOKEN: ${WHATSAPP_MCP_TOKEN:-}
      WHATSAPP_MCP_RATE_LIMIT: ${WHATSAPP_MCP_RATE_LIMIT:-}
      WHATSAPP_MCP_MAX_BODY_BYTES: ${WHATSAPP_MCP_MAX_BODY_BYTES:-}
      WHATSAPP_MCP_LOG_LEVEL: ${WHATSAPP_MCP_LOG_LEVEL:-INFO}
      WHATSAPP_MCP_LOG_FORMAT: ${WHATSAPP_MCP_LOG_FORMAT:-text}
      WHATSAPP_MCP_METRICS: ${WHATSAPP_MCP_METRICS:-true}
      WHATSAPP_BRIDGE_TIMEOUT_S: ${WHATSAPP_BRIDGE_TIMEOUT_S:-30}
      WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-}
      WHATSAPP_ALLOWED_CHATS: ${WHATSAPP_ALLOWED_CHATS:-}
      # Voice-note transcription (transcribe_audio tool). With the `whisper`
      # profile below, set WHISPER_URL=http://127.0.0.1:8178/inference in .env.
      WHATSAPP_STORE_DIR: /app/store
      WHISPER_URL: ${WHISPER_URL:-}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pt}
      FFMPEG_TIMEOUT_S: ${FFMPEG_TIMEOUT_S:-120}
    volumes:
      - whatsapp-store:/app/store
      # Same path as in the bridge so send_file(media_path=/app/outbox/x) works.
      - ${WHATSAPP_OUTBOX:-./outbox}:/app/outbox

  # Optional: local whisper.cpp server for the transcribe_audio tool.
  #   docker compose --profile whisper up -d
  # Downloads the ggml model on first start into the whisper-models volume and
  # serves it on 127.0.0.1:8178 inside the shared network namespace (CPU only).
  whisper:
    profiles: ["whisper"]
    # Pinned by digest: the `main` tag moves and is amd64-only. Dependabot
    # (docker-compose ecosystem) proposes digest bumps. On ARM hosts build
    # whisper.cpp yourself and point WHISPER_URL at it.
    image: ghcr.io/ggml-org/whisper.cpp:main@sha256:1eedd9a88bae3b1cd7066b305d22c927d7a8e036d8cf9100aae3d0a261f7d650
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${WHISPER_MEM_LIMIT:-3g}
    cpus: ${WHISPER_CPUS:-4}
    network_mode: "service:bridge"
    # Shares the bridge's network namespace (the MCP server reaches it on
    # 127.0.0.1:8178), so it is recreated whenever the bridge is.
    depends_on:
      bridge:
        condition: service_healthy
        restart: true
    # No healthcheck: the image ships neither wget nor curl and whisper-server
    # has no dedicated health route; transcribe_audio reports failures itself.
    environment:
      TZ: ${TZ:-UTC}
      # tiny | base | small | medium | large-v3 | large-v3-turbo (+ ".en" variants, "-q5_1" quantised...)
      WHISPER_MODEL_NAME: ${WHISPER_MODEL_NAME:-small}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pt}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
    volumes:
      - whisper-models:/models
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        model="/models/ggml-$${WHISPER_MODEL_NAME}.bin"
        if [ ! -f "$$model" ]; then
          echo "Downloading whisper model $${WHISPER_MODEL_NAME} to /models ..."
          /app/models/download-ggml-model.sh "$${WHISPER_MODEL_NAME}" /models
        fi
        exec /app/build/bin/whisper-server -m "$$model" -l "$${WHISPER_LANGUAGE}" -t "$${WHISPER_THREADS}" --host 127.0.0.1 --port 8178 --inference-path /inference

volumes:
  # WhatsApp session, messages.db, downloaded media and .bridge-token.
  # Back this up; losing it means re-pairing and losing local history.
  whatsapp-store:
  # ggml whisper models (whisper profile only).
  whisper-models:
