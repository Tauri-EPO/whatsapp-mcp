[project]
name = "whatsapp-mcp-server"
version = "0.6.0"
description = "WhatsApp integration for Claude via Model Context Protocol (MCP)"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Tauri-EPO" },
    { name = "Very Good Plugins" },
    { name = "Luke Harries" }
]
keywords = ["whatsapp", "mcp", "claude", "ai", "messaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # MCP Python SDK v2 (FastMCP renamed to MCPServer, transport config on run()).
    # httpx and cryptography come in through mcp; nothing here imports them directly.
    "mcp[cli]>=2.1.1,<3",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[project.urls]
Homepage = "https://github.com/Tauri-EPO/whatsapp-mcp"
Repository = "https://github.com/Tauri-EPO/whatsapp-mcp"
Issues = "https://github.com/Tauri-EPO/whatsapp-mcp/issues"

[tool.setuptools]
py-modules = ["main", "whatsapp", "audio", "mcp_config", "parent_watchdog", "transcribe", "http_auth", "chat_policy"]

[tool.mcp]
name = "io.github.tauri-epo/whatsapp-mcp"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
