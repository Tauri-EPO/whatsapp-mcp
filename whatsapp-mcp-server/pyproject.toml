# The backend that reads [tool.setuptools] below. Without this table PEP 517
# falls back to setuptools implicitly and uv keeps the project virtual, so
# `py-modules` is never exercised by anything; declaring it makes the project a
# real package (editable in the local venv, `uv build` produces the wheel that
# list describes). The image is unaffected: its `uv sync --no-install-project`
# still skips the project and the Dockerfile copies `*.py` itself. That wheel
# is a local check, never a release artifact — the releases are the container
# images (AGENTS.md §4), which is why `version` below stays nominal.
[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-mcp-server"
version = "0.6.0"
description = "WhatsApp integration for Claude via Model Context Protocol (MCP)"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Tauri-EPO" },
    { name = "Very Good Plugins" },
    { name = "Luke Harries" }
]
keywords = ["whatsapp", "mcp", "claude", "ai", "messaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # MCP Python SDK v2 (FastMCP renamed to MCPServer, transport config on run()).
    "mcp[cli]>=2.1.1,<3",
    # Bridge REST and whisper-server client; the same HTTP stack the SDK uses.
    "httpx>=0.28",
    # read_media(as_text=True): turn the documents WhatsApp carries into text on
    # this side, so a 5 MiB clinical PDF costs the agent a few dozen KB instead
    # of 7 MiB of base64 it cannot read. One small library per format, no OCR
    # and no office suite.
    "pypdf>=6.4",
    "python-docx>=1.2",
    "openpyxl>=3.1",
    # read_media images: downscale a photo to the ~1568 px a vision model reads
    # instead of shipping 6 MB of base64, apply the EXIF rotation and drop the
    # camera metadata (media_image.py). pillow-heif adds the one format Pillow
    # itself cannot open, which is what an iPhone attaches. Both ship
    # self-contained manylinux wheels for amd64 and arm64, so the image gains no
    # system packages.
    "pillow>=12.3",
    "pillow-heif>=1.7",
    # read_media(as_images=True): render the pages of a scanned PDF here, so the
    # documents as_text cannot read (photographed paper) reach a vision model as
    # pictures (media_pdf.py). Google's PDFium, the renderer in Chrome; same
    # wheel story as above.
    "pypdfium2>=5.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "pyright>=1.1.400",
    "ruff>=0.15.15",
]

[project.urls]
Homepage = "https://github.com/Tauri-EPO/whatsapp-mcp"
Repository = "https://github.com/Tauri-EPO/whatsapp-mcp"
Issues = "https://github.com/Tauri-EPO/whatsapp-mcp/issues"

[tool.setuptools]
# Every top-level module, sorted. A non-editable install ships exactly this
# list, so a name missing here is an ImportError in the wheel;
# tests/test_agents_file_tree.py fails the Python job when it drifts.
py-modules = [
    "audio",
    "chat_policy",
    "endpoint_cert",
    "errors",
    "export",
    "http_auth",
    "main",
    "mcp_config",
    "media_image",
    "media_inventory",
    "media_notes",
    "media_pdf",
    "media_read",
    "media_resource",
    "media_text",
    "notes",
    "observability",
    "parent_watchdog",
    "strict_args",
    "tool_policy",
    "transcribe",
    "transcribe_worker",
    "triage",
    "untrusted",
    "whatsapp",
]

[tool.mcp]
name = "io.github.tauri-epo/whatsapp-mcp"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
# Basic mode: catches Optional misuse, wrong call shapes and missing attributes
# without demanding annotations everywhere. Tests are checked too.
include = ["."]
# tests/ use duck-typed fakes (Resp classes, FakeServer, monkeypatched modules)
# on purpose; checking them in basic mode reports the fakes, not bugs.
exclude = [".venv", "**/__pycache__", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportMissingModuleSource = false
